<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>冰冰冰</title>
<style>
:root{--b0:#03102c;--b1:#0a2350;--b2:#123f8c;--b3:#1e6fe0;--b4:#79c6ff;--b5:#b6e3ff;--line:rgba(121,198,255,.22);--green:#27c07a;--gray:#6b7f9e;--red:#ff3b4e;--dim:#4a6a94;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:linear-gradient(170deg,var(--b0),var(--b1) 55%,var(--b0));color:var(--b4);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
#bg span{position:absolute;line-height:1;filter:drop-shadow(0 0 8px rgba(80,170,255,.35));}
#hud{position:fixed;top:12px;left:14px;right:14px;z-index:3000;display:flex;align-items:center;justify-content:space-between;pointer-events:none;}
#back-btn,#score-display{pointer-events:auto;}
#score-display{font-size:22px;font-weight:800;color:var(--b5);text-shadow:0 0 12px rgba(60,160,255,.8);background:rgba(6,26,66,.55);border:1px solid var(--line);border-radius:999px;padding:6px 14px;}
#back-btn{display:none;}
#notices{position:fixed;top:66px;left:10px;right:10px;z-index:800;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.notice{pointer-events:auto;background:rgba(16,58,124,.96);border:1px solid var(--b3);color:var(--b5);border-radius:12px;padding:11px 14px;font-size:14px;transition:transform .22s,opacity .22s;}
.notice.out{opacity:0;transform:translateX(120%);}
#main-screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#ice-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
#main-ice{font-size:150px;line-height:1;cursor:pointer;filter:drop-shadow(0 0 26px rgba(90,190,255,.55));animation:float 2.4s ease-in-out infinite;}
@keyframes float{0%,100%{translate:0 0;}50%{translate:0 -14px;}}
#combo{position:absolute;left:100%;top:6%;margin-left:-10px;color:var(--red);font-size:36px;font-weight:900;font-style:italic;text-shadow:0 0 14px rgba(255,59,78,.7);display:none;white-space:nowrap;}
#combo.show{display:block;}
.hint{margin-top:20px;font-size:14px;color:var(--b4);opacity:.85;text-align:center;}
#bottom-left{position:fixed;left:14px;bottom:96px;z-index:100;display:flex;gap:10px;}
#trophy-btn{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:3100;}
.list-screen{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;padding-bottom:62px;background:linear-gradient(170deg,rgba(3,16,44,.97),rgba(10,35,80,.97));}
.list-header{padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(6,24,60,.9);min-height:62px;}
.list-header h2{font-size:19px;font-weight:800;color:var(--b5);}
.list-sub{font-size:11px;color:var(--b4);line-height:1.4;}
.list-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 12px 92px;}
.item{background:rgba(18,63,140,.34);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;}
.item-name{font-size:16px;font-weight:800;color:var(--b5);margin-bottom:5px;}
.item-desc{font-size:12px;line-height:1.6;color:var(--b4);margin-bottom:10px;}
.item-btn.locked{background:#243a5e;color:#7e9ac0;}
.item-btn.ready{background:#1e6fe0;color:#ffffff;}
.item-btn.active{background:var(--green);color:#04240f;}
.item-btn.claimed{background:var(--gray);color:#e6f1ff;}
.item-btn.notenough{background:#6b2838;color:#ff9fb0;}
.list-bottom{padding:14px;text-align:center;font-size:13px;color:var(--b4);border-top:1px dashed var(--line);}
#site-note{position:fixed;left:0;right:0;bottom:0;z-index:3200;padding:12px 18px 14px;text-align:center;color:#a8d6ff;font-size:16px;font-weight:800;line-height:1.65;letter-spacing:.3px;text-shadow:0 0 12px rgba(60,160,255,.6);background:linear-gradient(0deg,rgba(3,16,44,.95) 0%,rgba(3,16,44,.72) 62%,rgba(3,16,44,0) 100%);pointer-events:none;}
</style>
</head>
<body>

<div id="js-dead" style="position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#c62828;color:#ffffff;font-size:13px;font-weight:800;padding:10px 12px;text-align:center;pointer-events:none;">脚本没跑起来（看到这行红字请截图）</div>

<div id="bg"></div>

<div id="hud">
  <button id="back-btn" type="button" style="padding:10px 18px;border:0;border-radius:0;background:#1e6fe0;color:#ffffff;font-size:14px;font-weight:800;cursor:pointer;">返回</button>
  <div id="score-display">🧊:<b id="score-val">0</b></div>
</div>

<div id="notices"></div>

<section id="main-screen">
  <div id="ice-wrap">
    <div id="main-ice">🧊</div>
    <div id="combo"></div>
  </div>
  <div class="hint">可以点击这个冰块来进行冰冰冰</div>
</section>

<div id="bottom-left">
  <button class="bl-btn" id="skill-btn" type="button" style="padding:14px 24px;border:0;border-radius:0;background:#1e6fe0;color:#ffffff;font-size:16px;font-weight:800;cursor:pointer;">技能</button>
  <button class="bl-btn" id="item-btn" type="button" style="padding:14px 24px;border:0;border-radius:0;background:#1e6fe0;color:#ffffff;font-size:16px;font-weight:800;cursor:pointer;">道具</button>
</div>

<button id="trophy-btn" type="button" style="padding:10px 18px;border:0;border-radius:0;background:#1e6fe0;color:#ffffff;font-size:14px;font-weight:800;cursor:pointer;">成就</button>

<section class="list-screen" id="screen-skill">
  <div class="list-header"><h2>技能</h2><div class="list-sub" id="sub-skill"></div></div>
  <div class="list-scroll" id="scroll-skill"></div>
  <div class="list-bottom" id="bottom-skill"></div>
</section>
<section class="list-screen" id="screen-item">
  <div class="list-header"><h2>道具</h2><div class="list-sub" id="sub-item"></div></div>
  <div class="list-scroll" id="scroll-item"></div>
  <div class="list-bottom" id="bottom-item"></div>
</section>
<section class="list-screen" id="screen-trophy">
  <div class="list-header"><h2>成就</h2><div class="list-sub" id="sub-trophy"></div></div>
  <div class="list-scroll" id="scroll-trophy"></div>
  <div class="list-bottom" id="bottom-trophy"></div>
</section>

<div id="site-note">本网站由奶油不吃糖果 B 站作者制作，请勿模仿，请勿二创，请勿二次消费，可免费游玩。</div>

<script>
/* Kernel: plain getElementById + addEventListener, exactly like the working test page. */
(function(){
"use strict";
var d=document.getElementById('js-dead'); if(d) d.style.display='none';

var S=0, C=0, K=0, L=0, T=null, P='main';
var SV=document.getElementById('score-val'), CB=document.getElementById('combo');
var D={skill:[],item:[],trophy:[]};
var used={}, claimed={};
var rl=300, al=86400;

/* background */
try{
  var h='';
  for(var i=0;i<90;i++){
    h+='<span style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)
      +'%;font-size:'+(20+Math.random()*48).toFixed(0)+'px;opacity:'+(0.05+Math.random()*0.10).toFixed(2)+'">\uD83E\uDDCA</span>';
  }
  document.getElementById('bg').innerHTML=h;
}catch(e){}

/* word pools */
var A1=['\u5bd2','\u971c','\u51db','\u51bd','\u51b0','\u96ea','\u51dd','\u51bb','\u6f88','\u6676','\u51cc','\u6714','\u7384','\u6e5b','\u9730','\u51c7'];
var B1=['\u4e4b\u529b','\u4e4b\u51fb','\u4e4b\u5203','\u4e4b\u606f','\u4e4b\u76fe','\u4e4b\u5951','\u4e4b\u6012','\u4e4b\u57df','\u4e4b\u77b3','\u4e4b\u5f8b','\u4e4b\u6838','\u4e4b\u7eb9','\u4e4b\u8a93','\u4e4b\u6f6e','\u4e4b\u950b','\u4e4b\u94ed'];
var A2=['\u8fde\u70b9\u5668','\u51b0\u971c\u836f\u6c34','\u5bd2\u51b0\u5377\u8f74','\u51b0\u6676\u5b9d\u77f3','\u971c\u94c3','\u51b0\u68f1','\u96ea\u7ed2','\u51bb\u661f','\u5bd2\u9732','\u51b0\u7802'];
var B2=['\u00b7\u58f9','\u00b7\u8d30','\u00b7\u53c1','\u00b7\u8086','\u00b7\u4f0d','\u00b7\u9646','\u00b7\u67d2','\u00b7\u634c','\u00b7\u7396','\u00b7\u62fe','\u00b7\u4f70','\u00b7\u4edf'];
var A3=['\u521d\u6b21\u51b0\u5c01','\u51b0\u51b0\u65b0\u624b','\u51b0\u5757\u72c2\u4eba','\u51b0\u971c\u5927\u5e08','\u7edd\u5bf9\u51b0\u795e','\u51db\u51ac\u884c\u8005','\u51dd\u971c\u8005','\u788e\u51b0\u8005'];
var B3=['\u00b7\u5e8f','\u00b7\u521d','\u00b7\u8fdb','\u00b7\u9510','\u00b7\u6df1','\u00b7\u6781','\u00b7\u7ec8','\u00b7\u79d8','\u00b7\u9690','\u00b7\u5dc5'];
var FX=[
 '\u6bcf\u6b21\u70b9\u51fb\u7a33\u5b9a +2 \u5206','\u8fde\u51fb\u6bcf 5 \u5c42\u989d\u5916 +1 \u5206','\u6982\u7387\u66b4\u51fb\uff0c\u672c\u6b21\u5f97\u5206 \u00d72','\u8fde\u51fb\u5224\u5b9a\u7a97\u53e3\u5ef6\u957f 120 \u6beb\u79d2',
 '\u4e24\u6b21\u70b9\u51fb\u95f4\u9694\u5f88\u77ed\u65f6\u989d\u5916 +2 \u5206','\u6bcf\u8fde\u7eed\u70b9\u6ee1 8 \u6b21\u7206\u53d1 +5 \u5206','\u6bcf\u6b21\u70b9\u51fb\u968f\u673a +1~4 \u5206',
 '\u505c\u624b\u65f6\u6309\u672c\u8f6e\u6700\u9ad8\u8fde\u51fb\u4e00\u6b21\u6027\u7ed3\u7b97','\u6bcf\u70b9\u6ee1 10 \u6b21\u5145\u80fd\u7206\u53d1 +8 \u5206','\u70b9\u51fb\u5f97\u5206\u4e0d\u8db3 4 \u5206\u65f6\u81ea\u52a8\u8865\u8db3',
 '\u81ea\u52a8\u8fde\u70b9\uff1a\u6bcf 1100 \u6beb\u79d2\u81ea\u52a8\u70b9\u4e00\u4e0b','\u7d2f\u8ba1\u6bcf\u70b9\u6ee1 25 \u6b21\u4e00\u6b21\u6027 +13 \u5206','\u6309\u5f53\u524d\u5206\u6570\u5343\u5206\u6bd4\u4ea7\u51fa',
 '\u6bcf\u8f6e\u8fde\u51fb\u7b2c 1 \u4e0b\u989d\u5916 +5 \u5206','\u63a5\u4e0b\u6765 6 \u6b21\u70b9\u51fb\u6bcf\u6b21\u989d\u5916 +3 \u5206','\u505c\u624b\u540e 1 \u79d2\u5185\u518d\u70b9\u4ecd\u7b97\u8fde\u51fb',
 '\u63a5\u4e0b\u6765 4 \u6b21\u70b9\u51fb\u5f97\u5206 \u00d72','\u4f7f\u7528\u65f6\u8fd4\u8fd8\u90e8\u5206\u6263\u9664\u5206\u6570','\u5355\u6b21\u70b9\u51fb\u6536\u76ca\u4e0a\u9650\u63d0\u9ad8 5 \u5206',
 '\u6bcf\u6b21\u70b9\u51fb\u968f\u673a +1~5 \u5206','\u6bcf\u70b9\u6ee1 12 \u6b21\u989d\u5916 +6 \u5206','\u6302\u7740\u4e0d\u52a8\u6bcf 12 \u79d2\u81ea\u52a8 +4 \u5206'
];
function names(a,b,n,first){
  var o=[];
  for(var i=0;i<n;i++){
    if(first&&i===0){ o.push(first); continue; }
    var x=a[i%a.length]+b[Math.floor(i/a.length)%b.length];
    if(o.indexOf(x)>=0) x=x+'\u00b7'+(i+1);
    o.push(x);
  }
  return o;
}
function build(kind,mix){
  var ns,n;
  if(kind==='skill'){ ns=names(A1,B1,200,'\u51b0\u4e4b\u529b'); n=200; }
  else if(kind==='item'){ ns=names(A2,B2,200,'\u8fde\u70b9\u5668'); n=200; }
  else { ns=names(A3,B3,400,null); n=400; }
  if(mix){ for(var j=n-1;j>0;j--){ var q=Math.floor(Math.random()*(j+1)),t=ns[j];ns[j]=ns[q];ns[q]=t; } }
  var arr=[];
  for(var i=0;i<n;i++){
    var e={name:ns[i],kind:kind,i:i,n:n};
    if(kind==='trophy'){
      e.req=5+i*5; e.reward=1+Math.floor(i/10)+(i%5); e.claimed=!!claimed[e.name];
      e.desc='\u7d2f\u8ba1\u70b9\u51fb\u51b0\u5757 '+e.req+' \u6b21 \u00b7 \u9886\u53d6\u5956\u52b1\uff1a+'+e.reward+' \u5206\uff08\u7b2c '+(i+1)+' \u9879\uff09';
    }else{
      e.req=(kind==='skill'&&i===0)?25:(kind==='item'&&i===0)?200:25+i*3+(i*7%12);
      e.cost=e.req; e.used=!!used[e.name]; e.fx=FX[i%FX.length]; e.power=i;
      e.desc='\u9700\u7d2f\u8ba1\u70b9\u51fb '+e.req+' \u6b21 \u00b7 \u4f7f\u7528\u6263\u9664 '+e.cost+' \u5206 \u00b7 \u6548\u679c\uff1a'+e.fx+'\uff08\u7b2c '+(i+1)+' \u9879\uff09';
    }
    arr.push(e);
  }
  D[kind]=arr;
}
build('skill',false); build('item',false); build('trophy',false);

/* effects: strongest per type only, hard cap */
var burst=0, burstAdd=0, dbl=0, charge=0, streak=0, timerA=0, autoT=null;
function active(){
  var best={};
  ['skill','item'].forEach(function(k){
    var a=D[k]||[];
    for(var i=0;i<a.length;i++){
      var e=a[i]; if(!e.used||!e.fx) continue;
      if(!best[e.fx]||e.power>best[e.fx].power) best[e.fx]=e;
    }
  });
  return best;
}
function gain(ctx){
  var F=active(), g=1;
  if(F.flat) g+=2;
  if(F.lucky) g+=1+Math.floor(Math.random()*3);
  if(F.comboMul) g+=Math.floor(ctx.combo/5);
  if(F.speed&&ctx.dt<300) g+=2;
  if(F.interest) g+=Math.min(6,Math.floor(ctx.score/1000));
  if(F.first&&ctx.combo===1) g+=5;
  if(F.charge){ charge++; if(charge>=10){charge=0;g+=8;} }
  if(F.streak){ streak++; if(streak>=8){streak=0;g+=5;} }
  if(F.milestone&&ctx.k>0&&ctx.k%25===0) g+=13;
  if(burst>0){ g+=burstAdd; burst--; }
  if(dbl>0){ g*=2; dbl--; }
  if(F.crit&&Math.random()*100<12) g*=2;
  if(F.floor) g=Math.max(g,4);
  return Math.max(1,Math.min(Math.round(g),25+(F.cap?5:0)));
}
function syncAuto(){
  var w=active().auto?1100:0;
  if(autoT){ clearInterval(autoT); autoT=null; }
  if(w>0) autoT=setInterval(function(){ if(P==='main') hit(); },w);
}

/* render */
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function score(){ if(SV) SV.textContent=S; }
function fmt(s){
  s=Math.max(0,s|0); var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  function p(n){ return (n<10?'0':'')+n; }
  return (h>0?h+':':'')+p(m)+':'+p(x);
}
function state(e){
  if(e.kind==='trophy'){
    if(e.claimed) return ['claimed','\u5df2\u9886\u53d6',true];
    if(K>=e.req) return ['ready','\u9886\u53d6',false];
    return ['locked',e.req+' \u6b21',true];
  }
  if(e.used) return ['active','\u5df2\u4f7f\u7528\uff0c\u6b63\u5728\u4f7f\u7528',true];
  if(K>=e.req&&S>=e.cost) return ['ready','\u4f7f\u7528(-'+e.cost+')',false];
  if(K>=e.req) return ['notenough','\u5206\u6570\u4e0d\u8db3('+e.cost+')',true];
  return ['locked',e.req+' \u6b21',true];
}
function render(){
  if(P==='main'||!D[P]) return;
  var sc=document.getElementById('scroll-'+P); if(!sc) return;
  var h='';
  for(var i=0;i<D[P].length;i++){
    var e=D[P][i], st=state(e);
    h+='<div class="item"><div class="item-name">'+esc(e.name)+'</div>'
      +'<div class="item-desc">'+esc(e.desc)+'</div>'
      +'<button type="button" class="item-btn '+st[0]+'" data-i="'+i+'"'+(st[2]?' disabled':'')
      +' style="padding:12px 20px;border:0;border-radius:0;font-size:14px;font-weight:800;cursor:pointer;">'+st[1]+'</button></div>';
  }
  sc.innerHTML=h;
  var sub=document.getElementById('sub-'+P);
  if(sub) sub.textContent='\u7d2f\u8ba1\u70b9\u51fb '+K+' \u6b21 \u00b7 \ud83e\uddca:'+S;
  var bot=document.getElementById('bottom-'+P);
  if(bot){
    if(P==='trophy') bot.innerHTML='\u5230\u5e95\u4e86 \u00b7 \u4e00\u5929\u540e\u5237\u65b0 \u00b7 \u5237\u65b0\u5012\u8ba1\u65f6 <b>'+fmt(al)+'</b>';
    else bot.innerHTML='\u5230\u5e95\u4e86 \u00b7 \u5237\u65b0\u5012\u8ba1\u65f6 <b>'+fmt(rl)+'</b> \u00b7 5 \u5206\u949f\u5237\u65b0\u4e00\u6b21';
  }
}
function go(n){
  ['skill','item','trophy'].forEach(function(k){ var x=document.getElementById('screen-'+k); if(x) x.style.display='none'; });
  var m=document.getElementById('main-screen'), b=document.getElementById('bottom-left'),
      t=document.getElementById('trophy-btn'), r=document.getElementById('back-btn');
  if(m) m.style.display=n==='main'?'flex':'none';
  if(b) b.style.display=n==='main'?'flex':'none';
  if(t) t.style.display=n==='main'?'block':'none';
  if(r) r.style.display=n==='main'?'none':'block';
  P=n;
  if(n!=='main'){
    var x=document.getElementById('screen-'+n); if(x) x.style.display='flex';
    var s2=document.getElementById('scroll-'+n); if(s2) s2.scrollTop=0;
    render();
  }
}
function notice(text){
  try{
    var box=document.getElementById('notices'); if(!box) return;
    var n=document.createElement('div'); n.className='notice'; n.textContent=text; box.appendChild(n);
    function kill(){ n.className='notice out'; setTimeout(function(){ n.remove(); },260); }
    setTimeout(kill,5000);
  }catch(e){}
}

/* ===== inline sound: lives in the SAME script as the working buttons ===== */
var BING=null, COMBO=null, PB=[], PC=[], ib=0, ic=0, AC=null, DEC={};
try{
