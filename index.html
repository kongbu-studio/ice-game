<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>冰冰冰 · 网站诊断</title>
<style>
body{margin:0;padding:24px;background:#061430;color:#cfe8ff;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;line-height:1.9}
.box{border:1px solid #2b6fd0;border-radius:12px;padding:14px;margin:12px 0;background:#0a2350}
#bar{background:#c62828;color:#fff;font-weight:800}
#bar.ok{background:#1b8f4b}
button{display:block;width:100%;padding:16px;font-size:17px;font-weight:800;border:0;border-radius:12px;background:#1e6fe0;color:#fff;margin:12px 0}
h2{font-size:18px;color:#79c6ff;margin:18px 0 6px}
code{background:#03102c;padding:2px 6px;border-radius:4px;color:#9fd4ff}
</style>
</head>
<body>

<div id="bar" class="box">🔴 脚本没有运行 —— 这就是你点不了的原因</div>

<div class="box">
  <div>心跳计数：<b id="beat">0</b>（每秒 +1，说明脚本在跑）</div>
  <div>最上层元素：<b id="hit">检测中…</b></div>
  <div>按钮点击结果：<b id="res">还没点</b></div>
</div>

<button id="testbtn">点我测试（能变色=点击没被挡）</button>

<h2>看结果对照</h2>
<div class="box">
① <b>红条 + 心跳 0</b> → 平台把脚本删了 / CSP 拦截 / iframe 没放开脚本<br>
② <b>绿条 + 心跳在跳，但按钮点不动 / 最上层不是 BUTTON</b> → 网站有全屏透明层盖住了<br>
③ <b>全绿 + 按钮变色</b> → 页面环境没问题，直接访问独立 .html 文件网址即可
</div>

<script>
(function(){
  var bar=document.getElementById('bar');
  bar.className='box ok';
  bar.textContent='🟢 脚本已运行';
  var n=0;
  setInterval(function(){ n++; document.getElementById('beat').textContent=n; },1000);
  setTimeout(function(){
    var e=document.elementFromPoint(innerWidth/2, innerHeight/2);
    document.getElementById('hit').textContent = e ? (e.tagName+(e.id?'#'+e.id:'')+(e.className&&typeof e.className==='string'?'.'+e.className.split(' ')[0]:'')) : '无';
  },300);
  function ok(){ document.getElementById('res').textContent='✅ 点击成功'; document.getElementById('testbtn').style.background='#1b8f4b'; }
  document.getElementById('testbtn').addEventListener('click',ok);
  document.addEventListener('click',function(e){ if(e.target&&e.target.id==='testbtn') ok(); },true);
  document.addEventListener('touchend',function(e){ if(e.target&&e.target.id==='testbtn') ok(); },true);
})();
</script>
</body>
</html>
