<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>冰冰冰</title>
<script>
/* Script sits at the very TOP of the file: if a paste gets truncated at the tail,
   the game still boots. DOM work waits for DOMContentLoaded. */
(function(){
"use strict";
function boot(){
  /* Button layer: independent IIFE, placed before all other scripts.
     Binding happens on line 1 at document capture phase. */
  (function(){
  "use strict";
  document.addEventListener('click', function(ev){
    if(pending && Date.now()-pending.t<700) pending.done=true;
    dispatch(ev.target);
  }, true);
  document.addEventListener('touchend', function(ev){
    try{
      var ch=ev.changedTouches && ev.changedTouches[0];
      var el=ch ? document.elementFromPoint(ch.clientX,ch.clientY) : ev.target;
      pending={t:Date.now(), el:el, done:false};
      setTimeout(function(){
        if(pending && !pending.done) dispatch(pending.el);
        pending=null;
      },600);
    }catch(e){}
  }, true);
  
  var BASE={}; window.__BASE=BASE;
  var pending=null;
  var IDS='#main-ice,#skill-btn,#item-btn,#trophy-btn,#back-btn';
  var MAP={'skill-btn':'skill','item-btn':'item','trophy-btn':'trophy','back-btn':'main'};
  
  try{ var dead=document.getElementById('js-dead'); if(dead) dead.style.display='none'; }catch(e){}
  window.onerror=function(msg,src,line,col,err){
    try{
      var d=document.getElementById('js-dead')||document.createElement('div');
      d.id='js-dead';
      d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#c62828;color:#fff;font-size:12px;font-weight:800;padding:9px 12px;text-align:center;pointer-events:none';
      d.textContent='\u811a\u672c\u63d0\u793a\uff1a'+(msg||'\u672a\u77e5\u9519\u8bef')+'\uff08\u884c '+(line||'?')+'\uff09';
      if(!d.parentNode) document.body.appendChild(d);
      d.style.display='block';
    }catch(e){}
    return true;
  };
  
  /* hand-written upward walk, no Element.closest (old WebView) */
  function closest(t){
    while(t && t.nodeType===1){
      if(t.id && IDS.indexOf('#'+t.id)>=0) return t;
      if(t.getAttribute && t.getAttribute('data-i')!==null && t.getAttribute('data-i')!==undefined) return t;
      t=t.parentElement;
    }
    return null;
  }
  
  /* pure-DOM fallback: depends on NO state, always adds score / switches page / beeps */
  var ACF=null;
  function miniFallback(t){
    try{
      if(t.id==='main-ice'){
        var sv=document.getElementById('score-val');
        if(sv) sv.textContent=(parseInt(sv.textContent,10)||0)+1;
        try{
          if(!ACF){ var C=window.AudioContext||window.webkitAudioContext; if(C) ACF=new C(); }
          if(ACF){
            if(ACF.state==='suspended'&&ACF.resume) ACF.resume();
            var o=ACF.createOscillator(), g=ACF.createGain();
            o.connect(g); g.connect(ACF.destination);
            o.frequency.setValueAtTime(880,ACF.currentTime);
            g.gain.setValueAtTime(0.09,ACF.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001,ACF.currentTime+0.12);
            o.start(); o.stop(ACF.currentTime+0.13);
          }
        }catch(e){}
        return;
      }
      var n=MAP[t.id]; if(!n) return;
      ['skill','item','trophy'].forEach(function(k){
        var x=document.getElementById('screen-'+k); if(x) x.style.display='none';
      });
      var m=document.getElementById('main-screen'), b=document.getElementById('bottom-left'),
          tb=document.getElementById('trophy-btn'), r=document.getElementById('back-btn');
      if(m) m.style.display=n==='main'?'flex':'none';
      if(b) b.style.display=n==='main'?'flex':'none';
      if(tb) tb.style.display=n==='main'?'block':'none';
      if(r) r.style.display=n==='main'?'none':'flex';
      if(n!=='main'){ var x2=document.getElementById('screen-'+n); if(x2) x2.style.display='flex'; }
    }catch(e){}
  }
  
  function dispatch(target){
    try{
      var t=closest(target); if(!t) return;
      if(t.id==='main-ice'){ if(BASE.doClick) BASE.doClick(); else miniFallback(t); return; }
      if(MAP[t.id]){ if(BASE.go) BASE.go(MAP[t.id]); else miniFallback(t); return; }
      if(t.getAttribute && t.getAttribute('data-i')!=null && BASE.use) BASE.use(t);
    }catch(e){
      try{ window.onerror(e.message||String(e),'',0,0,e); }catch(_){}
    }
  }
  window.__BTN_OK=true;
  })();
  /* Main logic: never binds a button. Fills BASE only after full init. */
  (function(){
  "use strict";
  var B=window.__BASE; if(!B) return;
  
  var S=0,C=0,K=0,L=0,T=null,P='main',rl=300,al=86400;
  var SV=document.getElementById('score-val'), CB=document.getElementById('combo');
  var D={skill:[],item:[],trophy:[]}, used={}, claimed={};
  
  /* built-in synth tones: needs NO external data */
  var ACX=null;
  function beep(k){
    try{
      if(!ACX){ var Cx=window.AudioContext||window.webkitAudioContext; if(Cx) ACX=new Cx(); }
      if(!ACX) return;
      if(ACX.state==='suspended'&&ACX.resume) ACX.resume();
      var o=ACX.createOscillator(), g=ACX.createGain(), t=ACX.currentTime;
      o.connect(g); g.connect(ACX.destination);
      if(k==='bing'){
        o.type='sine';
        o.frequency.setValueAtTime(900,t);
        o.frequency.exponentialRampToValueAtTime(1500,t+0.06);
        o.frequency.exponentialRampToValueAtTime(1100,t+0.11);
        g.gain.setValueAtTime(0.10,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
        o.start(t); o.stop(t+0.15);
      }else{
        o.type='triangle';
        o.frequency.setValueAtTime(520,t);
        o.frequency.exponentialRampToValueAtTime(180,t+0.22);
        g.gain.setValueAtTime(0.13,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.26);
        o.start(t); o.stop(t+0.27);
      }
    }catch(e){}
  }
  function snd(k){
    try{ if(window.SND && window.SND(k)!==false) return; }catch(e){}
    beep(k);
  }
  
  try{
    var h='';
    for(var i=0;i<90;i++){
      h+='<span style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)
        +'%;font-size:'+(20+Math.random()*48).toFixed(0)+'px;opacity:'+(0.05+Math.random()*0.10).toFixed(2)+'">\uD83E\uDDCA</span>';
    }
    document.getElementById('bg').innerHTML=h;
  }catch(e){}
  
  var A1=['\u5bd2','\u971c','\u51db','\u51bd','\u51b0','\u96ea','\u51dd','\u51bb','\u6f88','\u6676','\u51cc','\u6714','\u7384','\u6e5b','\u9730','\u51c7'];
  var B1=['\u4e4b\u529b','\u4e4b\u51fb','\u4e4b\u5203','\u4e4b\u606f','\u4e4b\u76fe','\u4e4b\u5951','\u4e4b\u6012','\u4e4b\u57df','\u4e4b\u77b3','\u4e4b\u5f8b','\u4e4b\u6838','\u4e4b\u7eb9','\u4e4b\u8a93','\u4e4b\u6f6e','\u4e4b\u950b','\u4e4b\u94ed'];
  var A2=['\u8fde\u70b9\u5668','\u51b0\u971c\u836f\u6c34','\u5bd2\u51b0\u5377\u8f74','\u51b0\u6676\u5b9d\u77f3','\u971c\u94c3','\u51b0\u68f1','\u96ea\u7ed2','\u51bb\u661f','\u5bd2\u9732','\u51b0\u7802'];
  var B2=['\u00b7\u58f9','\u00b7\u8d30','\u00b7\u53c1','\u00b7\u8086','\u00b7\u4f0d','\u00b7\u9646','\u00b7\u67d2','\u00b7\u634c','\u00b7\u7396','\u00b7\u62fe','\u00b7\u4f70','\u00b7\u4edf'];
  var A3=['\u521d\u6b21\u51b0\u5c01','\u51b0\u51b0\u65b0\u624b','\u51b0\u5757\u72c2\u4eba','\u51b0\u971c\u5927\u5e08','\u7edd\u5bf9\u51b0\u795e','\u51db\u51ac\u884c\u8005','\u51dd\u971c\u8005','\u788e\u51b0\u8005'];
  var B3=['\u00b7\u5e8f','\u00b7\u521d','\u00b7\u8fdb','\u00b7\u9510','\u00b7\u6df1','\u00b7\u6781','\u00b7\u7ec8','\u00b7\u79d8','\u00b7\u9690','\u00b7\u5dc5'];
  var FX=[
   '\u6bcf\u6b21\u70b9\u51fb\u7a33\u5b9a +2 \u5206','\u8fde\u51fb\u6bcf 5 \u5c42\u989d\u5916 +1 \u5206','\u6982\u7387\u66b4\u51fb\uff0c\u672c\u6b21\u5f97\u5206 \u00d72','\u8fde\u51fb\u5224\u5b9a\u7a97\u53e3\u5ef6\u957f 120 \u6beb\u79d2',
   '\u4e24\u6b21\u70b9\u51fb\u95f4\u9694\u5f88\u77ed\u65f6\u989d\u5916 +2 \u5206','\u6bcf\u8fde\u7eed\u70b9\u6ee1 8 \u6b21\u7206\u53d1 +5 \u5206','\u6bcf\u6b21\u70b9\u51fb\u968f\u673a +1~4 \u5206',
   '\u505c\u624b\u65f6\u6309\u672c\u8f6e\u6700\u9ad8\u8fde\u51fb\u4e00\u6b21\u6027\u7ed3\u7b97','\u6bcf\u70b9\u6ee1 10 \u6b21\u5145\u80fd\u7206\u53d1 +8 \u5206','\u70b9\u51fb\u5f97\u5206\u4e0d\u8db3 4 \u5206\u65f6\u81ea\u52a8\u8865\u8db3',
   '\u81ea\u52a8\u8fde\u70b9\uff1a\u6bcf 1100 \u6beb\u79d2\u81ea\u52a8\u70b9\u4e00\u4e0b','\u7d2f\u8ba1\u6bcf\u70b9\u6ee1 25 \u6b21\u4e00\u6b21\u6027 +13 \u5206','\u6309\u5f53\u524d\u5206\u6570\u5343\u5206\u6bd4\u4ea7\u51fa',
   '\u6bcf\u8f6e\u8fde\u51fb\u7b2c 1 \u4e0b\u989d\u5916 +5 \u5206','\u63a5\u4e0b\u6765 6 \u6b21\u70b9\u51fb\u6bcf\u6b21\u989d\u5916 +3 \u5206','\u505c\u624b\u540e 1 \u79d2\u5185\u518d\u70b9\u4ecd\u7b97\u8fde\u51fb',
   '\u63a5\u4e0b\u6765 4 \u6b21\u70b9\u51fb\u5f97\u5206 \u00d72','\u4f7f\u7528\u65f6\u8fd4\u8fd8\u90e8\u5206\u6263\u9664\u5206\u6570','\u5355\u6b21\u70b9\u51fb\u6536\u76ca\u4e0a\u9650\u63d0\u9ad8 5 \u5206',
   '\u6bcf\u6b21\u70b9\u51fb\u968f\u673a +1~5 \u5206','\u6bcf\u70b9\u6ee1 12 \u6b21\u989d\u5916 +6 \u5206','\u6302\u7740\u4e0d\u52a8\u6bcf 12 \u79d2\u81ea\u52a8 +4 \u5206'
  ];
  function names(a,b,n,first){
    var o=[];
    for(var i=0;i<n;i++){
      if(first&&i===0){ o.push(first); continue; }
      var x=a[i%a.length]+b[Math.floor(i/a.length)%b.length];
      if(o.indexOf(x)>=0) x=x+'\u00b7'+(i+1);
      o.push(x);
    }
    return o;
  }
  function build(kind,mix){
    var ns,n;
    if(kind==='skill'){ ns=names(A1,B1,200,'\u51b0\u4e4b\u529b'); n=200; }
    else if(kind==='item'){ ns=names(A2,B2,200,'\u8fde\u70b9\u5668'); n=200; }
    else { ns=names(A3,B3,400,null); n=400; }
    if(mix){ for(var j=n-1;j>0;j--){ var q=Math.floor(Math.random()*(j+1)),t=ns[j];ns[j]=ns[q];ns[q]=t; } }
    var arr=[];
    for(var i=0;i<n;i++){
      var e={name:ns[i],kind:kind,i:i,n:n};
      if(kind==='trophy'){
        e.req=5+i*5; e.reward=1+Math.floor(i/10)+(i%5); e.claimed=!!claimed[e.name];
        e.desc='\u7d2f\u8ba1\u70b9\u51fb\u51b0\u5757 '+e.req+' \u6b21 \u00b7 \u9886\u53d6\u5956\u52b1\uff1a+'+e.reward+' \u5206\uff08\u7b2c '+(i+1)+' \u9879\uff09';
      }else{
        e.req=(kind==='skill'&&i===0)?25:(kind==='item'&&i===0)?200:25+i*3+(i*7%12);
        e.cost=e.req; e.used=!!used[e.name]; e.fx=FX[i%FX.length]; e.power=i;
        e.desc='\u9700\u7d2f\u8ba1\u70b9\u51fb '+e.req+' \u6b21 \u00b7 \u4f7f\u7528\u6263\u9664 '+e.cost+' \u5206 \u00b7 \u6548\u679c\uff1a'+e.fx+'\uff08\u7b2c '+(i+1)+' \u9879\uff09';
      }
      arr.push(e);
    }
    D[kind]=arr;
  }
  build('skill',false); build('item',false); build('trophy',false);
  
  var burst=0,burstAdd=0,dbl=0,charge=0,streak=0,autoT=null;
  function active(){
    var best={};
    ['skill','item'].forEach(function(k){
      var a=D[k]||[];
      for(var i=0;i<a.length;i++){
        var e=a[i]; if(!e.used||!e.fx) continue;
        if(!best[e.fx]||e.power>best[e.fx].power) best[e.fx]=e;
      }
    });
    return best;
  }
  function gain(ctx){
    var F=active(), g=1;
    if(F.flat) g+=2;
    if(F.lucky) g+=1+Math.floor(Math.random()*3);
    if(F.comboMul) g+=Math.floor(ctx.combo/5);
    if(F.speed&&ctx.dt<300) g+=2;
    if(F.interest) g+=Math.min(6,Math.floor(ctx.score/1000));
    if(F.first&&ctx.combo===1) g+=5;
    if(F.charge){ charge++; if(charge>=10){charge=0;g+=8;} }
    if(F.streak){ streak++; if(streak>=8){streak=0;g+=5;} }
    if(F.milestone&&ctx.k>0&&ctx.k%25===0) g+=13;
    if(burst>0){ g+=burstAdd; burst--; }
    if(dbl>0){ g*=2; dbl--; }
    if(F.crit&&Math.random()*100<12) g*=2;
    if(F.floor) g=Math.max(g,4);
    return Math.max(1,Math.min(Math.round(g),25+(F.cap?5:0)));
  }
  function syncAuto(){
    var w=active().auto?1100:0;
    if(autoT){ clearInterval(autoT); autoT=null; }
    if(w>0) autoT=setInterval(function(){ if(P==='main') hit(); },w);
  }
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function score(){ if(SV) SV.textContent=S; }
  function fmt(s){
    s=Math.max(0,s|0); var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
    function p(n){ return (n<10?'0':'')+n; }
    return (h>0?h+':':'')+p(m)+':'+p(x);
  }
  function state(e){
    if(e.kind==='trophy'){
      if(e.claimed) return ['claimed','\u5df2\u9886\u53d6',true];
      if(K>=e.req) return ['ready','\u9886\u53d6',false];
      return ['locked',e.req+' \u6b21',true];
    }
    if(e.used) return ['active','\u5df2\u4f7f\u7528\uff0c\u6b63\u5728\u4f7f\u7528',true];
    if(K>=e.req&&S>=e.cost) return ['ready','\u4f7f\u7528(-'+e.cost+')',false];
    if(K>=e.req) return ['notenough','\u5206\u6570\u4e0d\u8db3('+e.cost+')',true];
    return ['locked',e.req+' \u6b21',true];
  }
  function render(){
    if(P==='main'||!D[P]) return;
    var sc=document.getElementById('scroll-'+P); if(!sc) return;
    var h='';
    for(var i=0;i<D[P].length;i++){
      var e=D[P][i], st=state(e);
      h+='<div class="item"><div class="item-name">'+esc(e.name)+'</div>'
        +'<div class="item-desc">'+esc(e.desc)+'</div>'
        +'<button type="button" class="item-btn glass '+st[0]+'" data-i="'+i+'"'+(st[2]?' disabled':'')+'>'+st[1]+'</button></div>';
    }
    sc.innerHTML=h;
    var sub=document.getElementById('sub-'+P);
    if(sub) sub.textContent='\u7d2f\u8ba1\u70b9\u51fb '+K+' \u6b21 \u00b7 \ud83e\uddca:'+S;
    var bot=document.getElementById('bottom-'+P);
    if(bot){
      if(P==='trophy') bot.innerHTML='\u5230\u5e95\u4e86 \u00b7 \u4e00\u5929\u540e\u5237\u65b0 \u00b7 \u5237\u65b0\u5012\u8ba1\u65f6 <b>'+fmt(al)+'</b>';
      else bot.innerHTML='\u5230\u5e95\u4e86 \u00b7 \u5237\u65b0\u5012\u8ba1\u65f6 <b>'+fmt(rl)+'</b> \u00b7 5 \u5206\u949f\u5237\u65b0\u4e00\u6b21';
    }
  }
  function go(n){
    ['skill','item','trophy'].forEach(function(k){ var x=document.getElementById('screen-'+k); if(x) x.style.display='none'; });
    var m=document.getElementById('main-screen'), b=document.getElementById('bottom-left'),
        t=document.getElementById('trophy-btn'), r=document.getElementById('back-btn');
    if(m) m.style.display=n==='main'?'flex':'none';
    if(b) b.style.display=n==='main'?'flex':'none';
    if(t) t.style.display=n==='main'?'block':'none';
    if(r) r.style.display=n==='main'?'none':'flex';
    P=n;
    if(n!=='main'){
      var x=document.getElementById('screen-'+n); if(x) x.style.display='flex';
      var s2=document.getElementById('scroll-'+n); if(s2) s2.scrollTop=0;
      render();
    }
  }
  function notice(text){
    try{
      var box=document.getElementById('notices'); if(!box) return;
      var n=document.createElement('div'); n.className='notice glass'; n.textContent=text; box.appendChild(n);
      var sx=0;
      n.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
      n.addEventListener('touchend',function(e){ if(Math.abs(e.changedTouches[0].clientX-sx)>40) kill(); },{passive:true});
      n.addEventListener('mousedown',function(e){ sx=e.clientX; });
      n.addEventListener('mouseup',function(e){ if(Math.abs(e.clientX-sx)>40) kill(); });
      function kill(){ n.className='notice glass out'; setTimeout(function(){ n.remove(); },260); }
      setTimeout(kill,5000);
    }catch(e){}
  }
  function hit(){
    var now=Date.now(), dt=now-L;
    C=(now-L<650)?C+1:1; L=now; K++;
    S+=gain({combo:C,dt:dt,k:K,score:S}); score();
    if(C>=2&&CB){ CB.textContent='\u00d7'+C; CB.className='show'; }
    snd('bing');
    clearTimeout(T);
    T=setTimeout(function(){
      if(C>=2) snd('combo');
      C=0; if(CB) CB.className='';
    },800);
  }
  function use(btn){
    if(!btn||btn.disabled||P==='main') return;
    var arr=D[P]; if(!arr) return;
    var e=arr[+btn.getAttribute('data-i')]; if(!e) return;
    if(P==='trophy'){
      if(e.claimed||K<e.req) return;
      e.claimed=true; claimed[e.name]=true; S+=e.reward;
    }else{
      if(e.used||K<e.req||S<e.cost) return;
      S-=e.cost; e.used=true; used[e.name]=true;
      if(e.fx==='refund') S+=Math.round(e.cost*0.2);
      if(e.fx==='burst'){ burst=6; burstAdd=3; }
      if(e.fx==='double') dbl=4;
      syncAuto();
    }
    score(); render();
  }
  setInterval(function(){
    rl--; al--;
    if(rl<=0){
      rl=300; build('skill',true); build('item',true);
      notice('\u6280\u80fd\u5df2\u5237\u65b0\uff0c5\u5206\u949f\u540e\u91cd\u65b0\u5237\u65b0'); notice('\u9053\u5177\u5df2\u5237\u65b0\uff0c5\u5206\u949f\u540e\u5237\u65b0');
    }
    if(al<=0){ al=86400; build('trophy',true); notice('\u6210\u5c31\u5df2\u5237\u65b0\uff0c\u4e00\u5929\u540e\u91cd\u65b0\u5237\u65b0'); }
    if(P!=='main') render();
  },1000);
  
  /* all init done -> publish into BASE */
  B.doClick=hit; B.go=go; B.use=use; B.notice=notice;
  score(); go('main');
  window.__OK=true;
  /* Render sound status once the DOM exists. */
  try{
    var st=window.__SND_STATUS;
    var el=document.getElementById('snd-status');
    if(el){
      if(st){ el.className=st.ok?'ok':'bad'; el.textContent=st.msg; }

<style>
:root{
  --b0:#03102c; --b1:#0a2350; --b2:#123f8c; --b3:#1e6fe0;
  --b4:#79c6ff; --b5:#b6e3ff; --line:rgba(121,198,255,.22);
  --green:#27c07a; --gray:#6b7f9e; --red:#ff3b4e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;}
/* 背景：从上到下的冰块渐变 */
body{background:linear-gradient(180deg,#02102e 0%,#092250 38%,#0d3480 68%,#041430 100%);
  color:var(--b4);font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
#bg::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(150,220,255,.12),transparent 42%,rgba(70,150,255,.07));}
#bg::after{content:"";position:absolute;inset:0;opacity:.16;
  background:repeating-linear-gradient(115deg,transparent 0 78px,rgba(190,235,255,.16) 78px 80px,transparent 80px 160px);}
#bg span{position:absolute;line-height:1;filter:drop-shadow(0 0 8px rgba(80,170,255,.35));}

/* ===== 液态玻璃 ===== */
.glass{
  position:relative;isolation:isolate;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(120,190,255,.06));
  -webkit-backdrop-filter:blur(18px) saturate(175%) brightness(1.08);
  backdrop-filter:blur(18px) saturate(175%) brightness(1.08);
  border:1px solid rgba(255,255,255,.26);
  border-radius:18px;
  box-shadow:0 8px 28px rgba(2,14,40,.38),
             inset 0 1px 1px rgba(255,255,255,.55),
             inset 0 -1px 1px rgba(255,255,255,.18),
             inset 1px 0 1px rgba(255,255,255,.14),
             inset -1px 0 1px rgba(255,255,255,.14);
  color:#eef8ff;text-shadow:0 1px 10px rgba(70,160,255,.55);
  pointer-events:auto;cursor:pointer;
  transition:transform .16s ease,background .22s ease,border-color .22s ease;
}
.glass::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.07) 30%,transparent 60%);
  mix-blend-mode:screen;pointer-events:none;}
.glass:active{transform:scale(.96);background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(120,190,255,.12));}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:linear-gradient(135deg,rgba(38,100,180,.72),rgba(14,50,110,.62));}
}

/* HUD */
#hud{position:fixed;top:12px;left:14px;right:14px;z-index:3000;display:flex;
  align-items:center;justify-content:space-between;pointer-events:none;}
#back-btn{display:none;width:44px;height:44px;line-height:1;border-radius:999px;
  font-size:26px;padding:0;text-align:center;}
#score-display{font-size:22px;font-weight:800;color:var(--b5);padding:7px 16px;border-radius:999px;}

/* 通知 */
#notices{position:fixed;top:66px;left:10px;right:10px;z-index:800;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.notice{pointer-events:auto;border-radius:14px;padding:11px 14px;font-size:14px;
  transition:transform .22s,opacity .22s;}
.notice.out{opacity:0;transform:translateX(120%);}

/* 主界面 */
#main-screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;}
#ice-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
#main-ice{font-size:150px;line-height:1;cursor:pointer;pointer-events:auto;
  filter:drop-shadow(0 0 26px rgba(90,190,255,.55));animation:float 2.4s ease-in-out infinite;}
@keyframes float{0%,100%{translate:0 0;}50%{translate:0 -14px;}}
#combo{position:absolute;left:100%;top:6%;margin-left:-10px;color:var(--red);
  font-size:36px;font-weight:900;font-style:italic;text-shadow:0 0 14px rgba(255,59,78,.7);
  display:none;white-space:nowrap;pointer-events:none;}
#combo.show{display:block;}
.hint{margin-top:20px;font-size:14px;color:var(--b4);opacity:.85;text-align:center;pointer-events:none;}

/* 左下角按钮 */
#bottom-left{position:fixed;left:14px;bottom:96px;z-index:100;display:flex;gap:10px;pointer-events:none;}
.bl-btn{padding:13px 26px;font-size:16px;font-weight:800;}

/* 成就入口 */
#trophy-btn{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:3100;
  padding:7px 16px 8px;border-radius:999px;text-align:center;}
#trophy-btn:active{transform:translateX(-50%) scale(.96);}
#trophy-btn .t-ice{font-size:28px;line-height:1.05;}
#trophy-btn .t-label{font-size:11px;letter-spacing:2px;margin-top:1px;}

/* 列表页 */
.list-screen{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;padding-bottom:62px;
  background:linear-gradient(180deg,rgba(3,16,44,.94),rgba(10,35,80,.96));}
.list-header{padding:10px 16px;border-bottom:1px solid var(--line);min-height:66px;}
.list-header h2{font-size:19px;font-weight:800;color:var(--b5);}
.list-sub{font-size:11px;color:var(--b4);line-height:1.4;}
.list-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 12px 92px;}
.item{background:rgba(18,63,140,.28);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;}
.item-name{font-size:16px;font-weight:800;color:var(--b5);margin-bottom:5px;}
.item-desc{font-size:12px;line-height:1.6;color:var(--b4);margin-bottom:10px;}
.item-btn{min-width:112px;padding:10px 18px;border-radius:14px;font-size:13px;font-weight:800;}
.item-btn.locked{background:rgba(40,70,120,.30);color:#8aa6c8;border-color:rgba(255,255,255,.14);}
.item-btn.ready{background:linear-gradient(135deg,rgba(50,140,255,.62),rgba(20,90,220,.38));
  border-color:rgba(160,215,255,.62);color:#ffffff;}
.item-btn.active{background:linear-gradient(135deg,rgba(39,192,122,.55),rgba(15,120,75,.36));
  border-color:rgba(120,255,190,.55);color:#eafff4;}
.item-btn.claimed{background:rgba(110,130,160,.32);color:#d5e3f5;}
.item-btn.notenough{background:rgba(190,50,80,.38);border-color:rgba(255,150,175,.42);color:#ffc7d4;}
.item-btn:disabled{cursor:default;opacity:1;}
.list-bottom{padding:14px;text-align:center;font-size:13px;color:var(--b4);border-top:1px dashed var(--line);pointer-events:none;}

/* 底部声明 */
#snd-status{position:fixed;top:46px;left:50%;transform:translateX(-50%);z-index:3300;
  padding:5px 14px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.5px;
  pointer-events:none;white-space:nowrap;display:none;}
#snd-status.ok{display:block;background:rgba(20,90,60,.82);color:#b8ffdc;border:1px solid rgba(120,255,190,.5);}
#snd-status.bad{display:block;background:rgba(150,50,20,.92);color:#ffe0c0;border:1px solid rgba(255,170,110,.6);}
#site-note{position:fixed;left:0;right:0;bottom:0;z-index:3200;padding:12px 18px 14px;
  text-align:center;color:#a8d6ff;font-size:16px;font-weight:800;line-height:1.65;letter-spacing:.3px;
  text-shadow:0 0 12px rgba(60,160,255,.6);
  background:linear-gradient(0deg,rgba(3,16,44,.95) 0%,rgba(3,16,44,.72) 62%,rgba(3,16,44,0) 100%);
  pointer-events:none;}
</style>
</head>
