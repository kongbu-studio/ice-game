<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>冰冰冰</title>
<style>
:root{
  --b0:#03102c; --b1:#0a2350; --b2:#123f8c; --b3:#1e6fe0;
  --b4:#79c6ff; --b5:#b6e3ff; --line:rgba(121,198,255,.22);
  --green:#27c07a; --gray:#6b7f9e; --red:#ff3b4e; --dim:#4a6a94;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:linear-gradient(170deg,var(--b0),var(--b1) 55%,var(--b0));color:var(--b4);
  font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;}

/* ===== 背景：只铺 🧊 ===== */
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
#bg span{position:absolute;line-height:1;filter:drop-shadow(0 0 8px rgba(80,170,255,.35));}

/* ===== 全局常驻分数 ===== */
#hud{position:fixed;top:12px;left:14px;right:14px;z-index:3000;display:flex;align-items:center;justify-content:space-between;}
#hud{pointer-events:none;}          /* 别挡住中间的成就按钮 */
#back-btn,#score-display{pointer-events:auto;}
#back-btn{display:none;background:none;border:0;color:var(--b5);font-size:30px;
  width:44px;height:44px;line-height:1;cursor:pointer;}
#back-btn:active{transform:scale(.9);}
#score-display{font-size:22px;font-weight:800;color:var(--b5);
  text-shadow:0 0 12px rgba(60,160,255,.8);background:rgba(6,26,66,.55);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;}
#score-display b{font-variant-numeric:tabular-nums;}

/* ===== 顶部通知 ===== */
#notices{position:fixed;top:66px;left:10px;right:10px;z-index:800;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.notice{pointer-events:auto;background:rgba(16,58,124,.96);border:1px solid var(--b3);
  color:var(--b5);border-radius:12px;padding:11px 14px;font-size:14px;
  box-shadow:0 6px 22px rgba(0,0,0,.35);transition:transform .22s,opacity .22s;}
.notice.out{opacity:0;transform:translateX(120%);}

/* ===== 主界面 ===== */
#main-screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
#ice-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
#main-ice{font-size:150px;line-height:1;cursor:pointer;
  filter:drop-shadow(0 0 26px rgba(90,190,255,.55));animation:float 2.4s ease-in-out infinite;transition:transform .09s;}
#main-ice:active{transform:scale(.86);}
#combo{position:absolute;left:100%;top:6%;margin-left:-10px;color:var(--red);
  font-size:36px;font-weight:900;font-style:italic;text-shadow:0 0 14px rgba(255,59,78,.7);
  display:none;white-space:nowrap;}
#combo.show{display:block;animation:pop .18s ease-out;}
@keyframes pop{from{transform:scale(.5);}to{transform:scale(1);}}
@keyframes float{0%,100%{translate:0 0;}50%{translate:0 -14px;}}
.hint{margin-top:20px;font-size:14px;color:var(--b4);opacity:.85;text-align:center;}

/* 左下角两个按钮 */
#bottom-left{position:fixed;left:14px;bottom:96px;z-index:100;display:flex;gap:10px;}
.bl-btn{background:linear-gradient(145deg,var(--b2),var(--b3));color:var(--b5);
  border:1px solid var(--b3);border-radius:14px;padding:12px 20px;font-size:15px;
  font-weight:700;box-shadow:0 4px 16px rgba(30,111,224,.4);cursor:pointer;}
.bl-btn:active{transform:scale(.94);}

/* 左上角成就入口（无边框） */
#trophy-btn{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:3100;
  background:none;border:0;color:var(--b4);cursor:pointer;text-align:center;}
#trophy-btn .t-ice{font-size:32px;line-height:1.1;}
#trophy-btn .t-label{font-size:12px;color:var(--b4);margin-top:2px;letter-spacing:2px;}
#trophy-btn:active{transform:translateX(-50%) scale(.92);}

/* ===== 列表界面 ===== */
.list-screen{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;padding-bottom:62px;
  background:linear-gradient(170deg,rgba(3,16,44,.97),rgba(10,35,80,.97));}
.list-header{padding:10px 132px 10px 70px;border-bottom:1px solid var(--line);
  background:rgba(6,24,60,.9);display:flex;flex-direction:column;align-items:flex-start;
  justify-content:center;gap:3px;min-height:62px;}
.list-header h2{font-size:19px;font-weight:800;color:var(--b5);line-height:1.15;}
.list-sub{margin-left:0;font-size:11px;color:var(--b4);line-height:1.2;}
.list-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:10px 12px 92px;touch-action:pan-y;}
.item{background:rgba(18,63,140,.34);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:9px;}
.item-name{font-size:16px;font-weight:800;color:var(--b5);margin-bottom:5px;}
.item-desc{font-size:12px;line-height:1.6;color:var(--b4);margin-bottom:10px;}
.item-btn{min-width:110px;min-height:38px;border-radius:10px;border:1px solid var(--line);
  background:rgba(10,40,96,.8);color:var(--b4);font-size:13px;font-weight:800;
  cursor:pointer;padding:6px 10px;}
.item-btn.locked{color:var(--dim);cursor:default;}
.item-btn.ready{background:linear-gradient(145deg,var(--b3),#2b8cff);color:#fff;
  border-color:#5ab0ff;box-shadow:0 0 14px rgba(43,140,255,.5);}
.item-btn.active{background:var(--green);color:#04240f;border-color:var(--green);}
.item-btn.claimed{background:var(--gray);color:#e6f1ff;border-color:var(--gray);}
.item-btn.notenough{background:rgba(120,40,60,.55);color:#ff9fb0;border-color:rgba(255,120,150,.4);cursor:default;}
.item-btn:disabled{opacity:1;}
.list-bottom{padding:14px;text-align:center;font-size:13px;color:var(--b4);
  border-top:1px dashed var(--line);}
.list-bottom b{color:var(--b5);font-variant-numeric:tabular-nums;}


/* ===== 底部常驻声明：无弹窗，不拦截任何点击 ===== */
#site-note{position:fixed;left:0;right:0;bottom:0;z-index:3200;
  padding:12px 18px 14px;text-align:center;
  color:#a8d6ff;font-size:16px;font-weight:800;line-height:1.65;
  letter-spacing:.3px;text-shadow:0 0 12px rgba(60,160,255,.6);
  background:linear-gradient(0deg,rgba(3,16,44,.95) 0%,rgba(3,16,44,.72) 62%,rgba(3,16,44,0) 100%);
  pointer-events:none;}

</style>
